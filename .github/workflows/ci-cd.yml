name: CI/CD

# CI roda em todo push e pull_request para a main.
# CD (deploy no Render) roda só em push na main e só se a CI passar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- CI
  test:
    name: CI - Lint, testes e build do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Python 3.11 (mesma versao do Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Testes unitarios (pytest)
        run: pytest -v

      - name: Build da imagem Docker do backend (mesma usada no Render)
        run: docker build -t devops-backend:ci .

  # ---------------------------------------------------------------- CD
  deploy:
    name: CD - Deploy no Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://devops-frontend-ys6u.onrender.com/
    steps:
      - name: Disparar deploy do backend
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: curl -fsS -X POST "$HOOK" -o /dev/null -w "HTTP %{http_code}\n"

      - name: Disparar deploy do frontend
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: curl -fsS -X POST "$HOOK" -o /dev/null -w "HTTP %{http_code}\n"
